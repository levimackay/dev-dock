name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # GitHub Pages serves a project site from /<repo>/, so the asset base has
      # to match or every chunk 404s. Set BASE_PATH in repository variables when
      # deploying to a custom domain served from the root.
      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/dev-dock/' }}

      # Pages has no rewrite rules, so the 404 page doubles as the SPA fallback.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
