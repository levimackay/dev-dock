name: Deploy to GitHub Pages

# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable:
# if an action's repository is compromised, every workflow pinned to `@v4`
# starts running the attacker's code on the next run. The trailing comment
# records the human-readable version, and Dependabot updates SHA pins in place.

# Deliberately manual. Enabling Pages is a publishing decision, and this
# workflow fails on every push until the repository has Pages turned on with
# "GitHub Actions" as the source. Once it is on, add back:
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # GitHub Pages serves a project site from /<repo>/, so the asset base has
      # to match or every chunk 404s. Set BASE_PATH in repository variables when
      # deploying to a custom domain served from the root.
      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/dev-dock/' }}

      # Pages has no rewrite rules, so the 404 page doubles as the SPA fallback.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
