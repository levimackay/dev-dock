name: Security

# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable:
# if an action's repository is compromised, every workflow pinned to `@v4`
# starts running the attacker's code on the next run. The trailing comment
# records the human-readable version, and Dependabot updates SHA pins in place.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after merge still surfaces without
    # anyone having to push. Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fails the build on a high or critical advisory in the production tree.
      # Moderate findings are reported but do not block, because the dev-only
      # tree churns and a blocked main branch teaches people to ignore the gate.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit everything (report only)
        run: pnpm audit --audit-level moderate || true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
