name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after merge still surfaces without
    # anyone having to push. Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fails the build on a high or critical advisory in the production tree.
      # Moderate findings are reported but do not block, because the dev-only
      # tree churns and a blocked main branch teaches people to ignore the gate.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit everything (report only)
        run: pnpm audit --audit-level moderate || true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
