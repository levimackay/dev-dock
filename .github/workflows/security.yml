name: Security

# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable:
# if an action's repository is compromised, every workflow pinned to `@v4`
# starts running the attacker's code on the next run. The trailing comment
# records the human-readable version, and Dependabot updates SHA pins in place.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after merge still surfaces without
    # anyone having to push. Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fails the build on a high or critical advisory in the production tree.
      # Moderate findings are reported but do not block, because the dev-only
      # tree churns and a blocked main branch teaches people to ignore the gate.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit everything (report only)
        run: pnpm audit --audit-level moderate || true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
