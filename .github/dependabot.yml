version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than one per package: a week of React,
      # Vite, and ESLint patch bumps as fifteen separate PRs gets ignored.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router-dom']
      tooling:
        patterns:
          [
            'vite',
            'vitest',
            '@vitejs/*',
            'typescript',
            'eslint*',
            'typescript-eslint',
            'prettier',
            '@vitest/*',
          ]
      testing:
        patterns: ['@playwright/*', '@testing-library/*', 'jsdom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # One PR for all of them. Ungrouped, a month of action releases arrives as
      # eight separate pull requests that each rerun the whole matrix, and the
      # habit that forms is closing them unread.
      actions:
        patterns: ['*']
