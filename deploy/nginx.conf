# Nginx server block for a self-hosted Dev Dock.
# Assumes the contents of `dist/` are at /srv/dev-dock.

server {
    listen 443 ssl http2;
    server_name devdock.example.com;

    root /srv/dev-dock;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/devdock.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devdock.example.com/privkey.pem;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src *; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else falls through to the SPA entry point.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name devdock.example.com;
    return 301 https://$host$request_uri;
}
